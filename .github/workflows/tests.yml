name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # agenda imports the three sibling CLIs in-process at runtime. The tests
      # stub those sources, but installing them here keeps the suite honest
      # about the environment agenda is actually built for.
      - name: Install siblings
        run: |
          for repo in skyward msl classroom; do
            git clone --depth 1 "https://github.com/CloudCompile/$repo-cli" "$RUNNER_TEMP/$repo"
            pip install -e "$RUNNER_TEMP/$repo"
          done

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest
